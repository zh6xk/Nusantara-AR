name: Build and Release NusantaraCrown AR

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD IOS (LINUX EXPORT XCODE -> MACOS COMPILE IPA)
  # =========================================================================
  build-ios:
    name: Build iOS Xcode 🍏
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity iOS (Xcode Project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.8f1
          buildName: NusantaraCrown-AR-iOS
          buildsPath: build/iOS

      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-Xcode
          path: build/iOS/iOS
          retention-days: 7

  compile-ipa:
    name: Compile iOS .ipa 📦
    needs: [build-ios]
    runs-on: macos-latest
    steps:
      - name: Download iOS Xcode Artifact
        uses: actions/download-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-Xcode
          path: xcode-project

      - name: Fix file permissions
        run: |
          chmod -R +x xcode-project/NusantaraCrown-AR-iOS/*.sh
          find xcode-project/NusantaraCrown-AR-iOS -type f -name "usymtool*" -exec chmod +x {} \;

      - name: Build unsigned .app via xcodebuild
        run: |
          cd xcode-project/NusantaraCrown-AR-iOS
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build_output

      - name: Package .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find xcode-project/NusantaraCrown-AR-iOS/build_output -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r NusantaraCrown-AR-v0.0.1.ipa Payload
          mkdir -p ipa-output
          mv NusantaraCrown-AR-v0.0.1.ipa ipa-output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-IPA
          path: ipa-output/*.ipa
          retention-days: 14

  # =========================================================================
  # 2. BUILD ANDROID APK (ARCORE OPTIONAL)
  # =========================================================================
  build-android:
    name: Build Android APK 🤖
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: 6000.6.8f1
          buildName: NusantaraCrown-AR-v0.0.1
          buildsPath: build/Android
          androidExportType: 'androidPackage'
          androidKeystoreName: ''

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-Android-v0.0.1
          path: build/Android/**/*.apk
          retention-days: 14

  # =========================================================================
  # 3. CREATE GITHUB RELEASE
  # =========================================================================
  release:
    name: Publish Release v0.0.1 🚀
    needs: [build-android, compile-ipa]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.compile-ipa.result == 'success')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        if: needs.build-android.result == 'success'
        with:
          name: NusantaraCrown-AR-Android-v0.0.1
          path: release-assets/

      - name: Download iOS IPA Artifacts
        uses: actions/download-artifact@v4
        if: needs.compile-ipa.result == 'success'
        with:
          name: NusantaraCrown-AR-iOS-IPA
          path: release-assets/

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v0.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release v0.0.1
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "NusantaraCrown AR ${{ steps.get_version.outputs.TAG }}"
          body: |
            ## NusantaraCrown AR Release ${{ steps.get_version.outputs.TAG }} 👑🇮🇩
            
            Aplikasi Augmented Reality (AR) interaktif mencoba 10 mahkota adat tradisional Indonesia secara langsung di atas kepala.
            
            ### 📦 File Unduhan:
            - **Android APK (Fix ARCore Optional)**: `NusantaraCrown-AR-v0.0.1.apk`
            - **iOS IPA**: `NusantaraCrown-AR-v0.0.1.ipa` (Install via TrollStore / AltStore / Sideloadly)
            
            ### ✨ Fitur Utama Versi 0.0.1:
            - 10 Mahkota Tradisional lengkap dari 5 pulau besar (Sumatera, Jawa, Kalimantan, Sulawesi, Papua) untuk Pria & Wanita.
            - Dual tracking: Native ARCore & ARKit Face Tracking.
            - UI/UX Glassmorphism (Figma design token) dengan info budaya 3 poin & capture photo.
          draft: false
          prerelease: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa
