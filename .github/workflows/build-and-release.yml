name: Build and Release NusantaraCrown AR

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.4)'
        required: true
        default: 'v0.0.4'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. BUILD IOS (LINUX EXPORT XCODE -> MACOS COMPILE IPA)
  # =========================================================================
  build-ios:
    name: Build iOS Xcode 🍏
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space & Add Swap
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /usr/local/lib/android 2>/dev/null || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-v3-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v3-iOS-

      - name: Build Unity iOS (Xcode Project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.8f1
          buildName: NusantaraCrown-AR-iOS
          buildsPath: build/iOS

      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-Xcode
          path: build/iOS/iOS
          retention-days: 7

  compile-ipa:
    name: Compile iOS .ipa 📦
    needs: [build-ios]
    runs-on: macos-latest
    steps:
      - name: Download iOS Xcode Artifact
        uses: actions/download-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-Xcode
          path: xcode-project

      - name: Fix file permissions
        run: |
          chmod -R +x xcode-project/NusantaraCrown-AR-iOS/*.sh
          find xcode-project/NusantaraCrown-AR-iOS -type f -name "usymtool*" -exec chmod +x {} \;

      - name: Build unsigned .app via xcodebuild
        run: |
          cd xcode-project/NusantaraCrown-AR-iOS
          xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build_output

      - name: Package .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find xcode-project/NusantaraCrown-AR-iOS/build_output -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r NusantaraCrown-AR-v0.0.4.ipa Payload
          mkdir -p ipa-output
          mv NusantaraCrown-AR-v0.0.4.ipa ipa-output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-iOS-IPA
          path: ipa-output/*.ipa
          retention-days: 14

  # =========================================================================
  # 2. BUILD ANDROID APK (ARCORE OPTIONAL)
  # =========================================================================
  build-android:
    name: Build Android APK 🤖
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space & Add Swap
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /usr/local/lib/android 2>/dev/null || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-v3-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-v3-Android-

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: 6000.6.8f1
          buildName: NusantaraCrown-AR-v0.0.4
          buildsPath: build/Android
          androidExportType: 'androidPackage'
          androidKeystoreName: ''

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraCrown-AR-Android-v0.0.4
          path: build/Android/**/*.apk
          retention-days: 14

  # =========================================================================
  # 3. CREATE GITHUB RELEASE
  # =========================================================================
  release:
    name: Publish Release v0.0.4 🚀
    needs: [build-android, compile-ipa]
    runs-on: ubuntu-24.04
    if: always() && (needs.build-android.result == 'success' || needs.compile-ipa.result == 'success')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        if: needs.build-android.result == 'success'
        with:
          name: NusantaraCrown-AR-Android-v0.0.4
          path: release-assets/

      - name: Download iOS IPA Artifacts
        uses: actions/download-artifact@v4
        if: needs.compile-ipa.result == 'success'
        with:
          name: NusantaraCrown-AR-iOS-IPA
          path: release-assets/

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v0.0.4" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release v0.0.4
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "NusantaraCrown AR ${{ steps.get_version.outputs.TAG }} 👑🇮🇩"
          body: |
            ### NusantaraCrown AR ${{ steps.get_version.outputs.TAG }}

            Pembaruan versi 4 (v0.0.4):
            - **Anti-Jitter 3D Mahkota**: Pelacakan kepala lebih stabil dan halus tanpa bergetar-getar.
            - **Hapus Shape Oval di Bawah Mahkota**: Menghilangkan artefak oval occluder di bawah mahkota.
            - **Kamera Depan Mirror Natural & Kamera Belakang 1x**: Arah kamera depan sesuai cermin (kiri ke kiri), dan perpindahan ke kamera belakang otomatis memilih lensa utama 1x (tidak zoom/telephoto).
            - **Tombol Senter & Galeri Asli**: Tombol kiri atas mengaktifkan senter perangkat; tombol galeri kanan bawah langsung membuka aplikasi Galeri/Photos.
            - **UX Jepret, Retake, Simpan ke Galeri & Share Gambar**: Hasil jepretan tidak memutih, menyembunyikan HUD utama, menyisakan Retake / Simpan ke Galeri / Share gambar asli.

            ### Unduhan File Aplikasi:
            - **Android APK**: `NusantaraCrown-AR-${{ steps.get_version.outputs.TAG }}.apk`
            - **iOS IPA**: `NusantaraCrown-AR-${{ steps.get_version.outputs.TAG }}.ipa`

            ### 10 Mahkota Tradisional Nusantara:
            1. **Sumatera**: Suntiang Gadang (Wanita) & Deta Saluak Batimba (Pria) — Minangkabau
            2. **Jawa**: Mahkota Pengantin Paes Ageng (Wanita) & Kuluk Kanigaran (Pria) — Kasultanan Ngayogyakarta
            3. **Kalimantan**: Lavung Manik Dayak Kenyah (Wanita) & Lavung Sekop Hornbill (Pria)
            4. **Sulawesi**: Saloko Toraja Sa'dan Emas (Wanita) & Passapu Patonro Makassar (Pria)
            5. **Papua**: Kasuari Cowrie Shell Plume (Wanita) & Bird of Paradise Cenderawasih (Pria)
          draft: false
          prerelease: false
          files: |
            release-assets/**/*.apk
            release-assets/**/*.ipa
